parameters:
  - name: azureSubscription
    displayName: 'Azure Service Connection'
    type: string
    default: 'azure-service-connection'
  - name: appName
    displayName: 'App Name'
    type: string
    default: 'cicd-demo-app'
  - name: resourceGroup
    displayName: 'Resource Group'
    type: string
    default: 'cicd-demo'

resources:
  pipelines:
    - pipeline: build
      source: 'Build and Test'
      trigger:
        branches:
          include:
            - main

trigger: none

jobs:
  - job: deploy
    displayName: 'Deploy to Azure'
    pool: default

    steps:
      - checkout: self

      - task: UseNode@1
        displayName: 'Install Node.js'
        inputs:
          version: '20.x'

      - download: build
        artifact: drop
        displayName: 'Download build artifact'
        patterns: '**/*'

      - task: AzureCLI@2
        displayName: 'Deploy to Azure Static Web Apps using az cli'
        inputs:
          azureSubscription: ${{ parameters.azureSubscription }}
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          inlineScript: |
            $token = az staticwebapp secrets list --name ${{ parameters.appName }} --resource-group ${{ parameters.resourceGroup }} --query properties.apiKey -o tsv
            npx @azure/static-web-apps-cli deploy "$(Pipeline.Workspace)/build/drop" --deployment-token $token --env production
