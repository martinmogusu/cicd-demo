resources:
  pipelines:
    - pipeline: build
      source: 'Build and Test'
      trigger:
        branches:
          include:
            - main

trigger: none

jobs:
  - job: deploy
    displayName: 'Deploy to Azure'
    pool: default

    steps:
      - checkout: self

      - task: UseNode@1
        displayName: 'Install Node.js'
        inputs:
          version: '20.x'

      - download: build
        artifact: drop
        displayName: 'Download build artifact'
        patterns: '**/*'

      - task: AzureCLI@2
        displayName: 'Deploy to Azure Static Web Apps using az cli'
        inputs:
          azureSubscription: 'azure-service-connection'
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          inlineScript: |
            $token = az staticwebapp secrets list --name testswa --resource-group cicd --query properties.apiKey -o tsv
            npx @azure/static-web-apps-cli deploy "$(Pipeline.Workspace)/build/drop" --deployment-token $token --env production
